<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Controle pessoal de receitas e despesas.">
  <meta name="theme-color" content="#00897B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meu Mês">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Meu Mês Finanças</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f2faf8;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #effaf7 0%, #ffffff 100%);
      color: #173b36;
      z-index: 9999;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
    }

    .loading-logo {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #00897b;
      color: white;
      font-size: 36px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(0, 137, 123, 0.24);
    }

    .loading-title {
      margin: 18px 0 6px;
      font-size: 26px;
      font-weight: 700;
    }

    .loading-status {
      margin: 0 0 24px;
      color: #52706b;
      font-size: 14px;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 137, 123, 0.2);
      border-top-color: #00897b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="loading-logo">M</div>
      <div class="loading-title">Meu M&ecirc;s</div>
      <p id="loading-status" class="loading-status">
        Preparando suas finan&ccedil;as...
      </p>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
